quarkus.http.port=8080

# Directory used for permanent file storage. A single command-line argument can override it.
file-server.directory=${user.home}/mani/xx/

# Match the original 1000 MB upload limits.
quarkus.http.limits.max-body-size=1000M
quarkus.http.limits.max-form-attribute-size=1000M

# Uploaded multipart files are moved to permanent storage by the resource.
quarkus.http.body.delete-uploaded-files-on-end=true

# Preserve the original documentation URLs.
quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
